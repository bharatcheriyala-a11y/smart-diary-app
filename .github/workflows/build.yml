name: Build Clean Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Web-to-APK Project
        run: |
          mkdir -p www
          # Copy html and icon
          find . -maxdepth 2 -name "*.html" -exec cp {} www/index.html \;
          find . -maxdepth 2 -name "*.png" -exec cp {} www/icon.png \;

          # Install official Capacitor
          npm init -y
          npm install @capacitor/core@5.7.0 @capacitor/cli@5.7.0 @capacitor/android@5.7.0
          npx cap init "Smart Diary" "com.bharat.smartdiary" --web-dir www
          npx cap add android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Official Clean APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartDiary-Official-Clean-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
